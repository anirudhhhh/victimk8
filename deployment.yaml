apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victim
  template:
    metadata:
      labels:
        app: victim
      annotations:
        repo-url: "https://github.com/anirudhhhh/victimk8"
        git/branch: "main"
    spec:
      containers:
        - name: victim-container
          image: anirudhhhh/victimk8:latest
          ports:
            - containerPort: 3000
              ports:
                - containerPort: 3000
              resources:
                limits:
                  memory: "128Mi"
                  cpu: "500m"
